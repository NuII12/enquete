<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tableau comparatif – Taux de suspicion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1015;--line:#232a34;--txt:#e9edf2;--mute:#8b96a5;--acc:#6ee7c8}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--txt);font:15px/1.4 Sora,system-ui,sans-serif;
  padding:clamp(14px,3vw,36px);padding-top:calc(clamp(14px,3vw,36px) + env(safe-area-inset-top,0px));
  background:radial-gradient(900px 500px at 12% -10%,#1b2f3f 0,transparent 60%),radial-gradient(700px 420px at 100% 0,#2b1c33 0,transparent 55%),var(--bg)}
header{max-width:1240px;margin:0 auto 22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:clamp(1.6rem,4vw,2.5rem);letter-spacing:-.02em;font-weight:700}
.sous{margin:4px 0 0;color:var(--mute)}
.haut{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:#ffffff0d;border:1px solid #ffffff14;backdrop-filter:blur(8px);font-size:.85rem}
.pill.fort{color:var(--acc);border-color:#6ee7c855}
.pill i{width:8px;height:8px;border-radius:50%;background:#e0a33a}
.pill.ok i{background:var(--acc);animation:pouls 2.4s infinite}
#stat b{color:#ff8a7a}
button{font:inherit;cursor:pointer;color:var(--txt);border:1px solid #ffffff14;background:#ffffff0d;border-radius:999px;width:42px;height:38px;font-size:1.05rem;transition:transform .15s,background .15s}
button:hover:not(:disabled){background:#ffffff1a;transform:translateY(-1px)}
button:active:not(:disabled){transform:scale(.95)}
button:disabled{opacity:.5;cursor:default}
.btn{width:auto;padding:0 16px;height:40px;font-size:.9rem}
.pri{background:var(--acc);color:#06241c;border-color:transparent;font-weight:700}
.pri:hover:not(:disabled){background:#8bf0d6}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.panel{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#171d25f2,#11151bf2);box-shadow:0 30px 60px -30px #000}
.tete,.row{display:grid;grid-template-columns:46px 1fr minmax(150px,44%);gap:10px;align-items:center;padding:0 16px}
.tete{height:46px;color:var(--mute);font-size:.8rem;border-bottom:1px solid var(--line);background:#ffffff06}
.row{height:56px;border-bottom:1px solid #1b212a;transition:background .2s}
.row:last-child{border-bottom:0}
.row:hover{background:#ffffff08}
.n{color:var(--mute);font-weight:600;text-align:center}
input{font:inherit;color:inherit;border:0;background:transparent;min-width:0}
.nom{width:100%;height:36px;padding:0 10px;border-radius:10px;font-weight:600}
.nom:focus{background:#ffffff12;outline:2px solid var(--acc)}
.jauge{position:relative;display:flex;align-items:center;justify-content:flex-end;height:36px;border-radius:12px;background:#ffffff0a;overflow:hidden;cursor:text}
.jauge::before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--v,0)*1%);background:linear-gradient(90deg,hsl(var(--h,140) 65% 38% / .35),hsl(var(--h,140) 75% 50% / .8));border-radius:12px;transition:width .5s cubic-bezier(.2,.9,.3,1),background .5s}
.jauge input{position:relative;width:4.2em;height:100%;text-align:right;font-weight:700;-moz-appearance:textfield}
.jauge input::-webkit-outer-spin-button,.jauge input::-webkit-inner-spin-button{-webkit-appearance:none}
.jauge input:focus-visible{outline:0}
.jauge:focus-within{outline:2px solid var(--acc)}
.jauge b{position:relative;padding:0 12px 0 2px;color:#ffffffb0;font-weight:600}
.lecture .nom,.lecture .jauge{cursor:default}
.lecture .nom:focus{background:transparent;outline:0}
.lecture .jauge:focus-within{outline:0}
.row.chaud .jauge{box-shadow:0 0 0 1px #ff5a4a88,0 0 18px -4px #ff5a4a}
.flash{animation:flash 1.3s ease-out}
dialog{border:1px solid var(--line);border-radius:22px;background:#141920;color:var(--txt);padding:26px;width:min(420px,92vw);box-shadow:0 40px 80px -20px #000}
dialog::backdrop{background:#000b;backdrop-filter:blur(5px)}
dialog h2{margin:0 0 14px;font-size:1.3rem}
#porte{width:min(420px,100%);margin:6vh auto 0;padding:28px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,#171d25f2,#11151bf2);box-shadow:0 30px 60px -30px #000}
#porte h1{font-size:1.7rem}
#porte .sous{margin:6px 0 18px}
.onglets{display:flex;gap:6px;margin-bottom:12px}
.onglets button{flex:1;width:auto;border-radius:12px;height:40px;font-size:.9rem}
.onglets [aria-selected=true]{background:var(--acc);color:#06241c;border-color:transparent;font-weight:700}
label.ch{display:block;margin:10px 0;font-size:.85rem;color:var(--mute)}
label.ch input{display:block;width:100%;margin-top:6px;height:42px;padding:0 12px;border-radius:12px;background:#ffffff0d;border:1px solid #ffffff18;color:var(--txt);font-size:1rem}
.rester{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:.85rem;color:var(--mute);cursor:pointer}
.rester input{width:auto;height:auto;margin:0;accent-color:var(--acc)}
.err{min-height:1.3em;margin:8px 0;color:#ff8a7a;font-size:.85rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.lien{background:none;border:0;width:auto;height:auto;padding:0;color:var(--mute);font-size:.82rem;text-decoration:underline}
.note{color:var(--mute);font-size:.82rem;margin:8px 0}
.ou{margin:14px 0 10px;text-align:center;color:var(--mute);font-size:.82rem}
.google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border-color:transparent;font-weight:600}
.google:hover:not(:disabled){background:#f1f3f4}
.lig{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
#listeAdmins{max-height:50vh;overflow:auto}
#dlgAdmins{width:min(640px,94vw)}
.lig small{display:block;color:var(--mute);font-size:.78rem;overflow-wrap:anywhere}
.pt{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:#56606e}
.pt.on{background:var(--acc)}
#toast{position:fixed;z-index:9;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  padding:10px 18px;border-radius:999px;background:#1f2731;border:1px solid #ffffff1c;transition:.3s}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes flash{from{background:#6ee7c840}to{background:transparent}}
@keyframes pouls{70%{box-shadow:0 0 0 8px #6ee7c800}0%{box-shadow:0 0 0 0 #6ee7c880}}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="lecture">

<!-- Page de connexion : affichée tant que l'appareil n'a pas de session -->
<section id="porte" hidden>
  <h1>Taux de suspicion</h1>
  <p class="sous">Connectez-vous pour voir le tableau.</p>
  <div class="onglets" role="tablist">
    <button type="button" id="tabCo" role="tab">Connexion</button>
    <button type="button" id="tabIn" role="tab">Inscription</button>
  </div>
  <form id="fAuth">
    <label class="ch" id="lPseudo" hidden>Pseudo<input id="pseudo" maxlength="20" minlength="2" autocomplete="nickname"></label>
    <label class="ch">E-mail<input id="email" type="email" required autocomplete="email"></label>
    <label class="ch">Mot de passe<input id="mdp" type="password" required minlength="6" autocomplete="current-password"></label>
    <label class="rester"><input type="checkbox" id="rester" checked>Rester connecté sur cet appareil</label>
    <p class="err" id="erreur" role="alert"></p>
    <div class="actions"><button class="btn pri" id="goAuth">Se connecter</button></div>
    <p class="ou">ou</p>
    <button type="button" class="btn google" id="goGoogle">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Continuer avec Google
    </button>
    <p class="note"><button class="lien" type="button" id="oubli">Mot de passe oublié ?</button></p>
  </form>
</section>

<header hidden>
  <div><h1>Taux de suspicion</h1><p class="sous">Tableau comparatif des élèves, modifiable par les admins</p></div>
  <div class="haut">
    <div class="pill" id="stat">Plus suspect : –</div>
    <div class="pill" id="etat"><i></i><span>Connexion…</span></div>
    <div class="pill" id="role">Lecteur</div>
    <button class="btn pri" id="bPanel" hidden>Panneau admin</button>
    <button class="btn" id="compte">Compte</button>
    <button id="mute" aria-label="Couper le son" title="Son">🔊</button>
  </div>
</header>
<main class="wrap" hidden>
  <section class="panel"><div class="tete"><span>N°</span><span>Élève</span><span>Taux de suspicion</span></div><div id="g"></div></section>
  <section class="panel"><div class="tete"><span>N°</span><span>Élève</span><span>Taux de suspicion</span></div><div id="d"></div></section>
</main>

<dialog id="dlgCompte">
  <h2 id="cNom">Compte</h2>
  <p class="note" id="cRole"></p>
  <label class="ch">Votre identifiant (UID)<input id="uid" readonly></label>
  <div class="actions">
    <button class="btn" id="bDeco">Se déconnecter</button>
    <button class="btn" data-close>Fermer</button>
  </div>
</dialog>

<dialog id="dlgAdmins">
  <h2>Panneau admin</h2>
  <p class="note" id="nbComptes"></p>
  <div id="listeAdmins"></div>
  <div class="actions"><button class="btn" data-close>Fermer</button></div>
</dialog>
<div id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC_bHVAesDfFhh9QCXGtOxHDZgdwSqxMtI",
  authDomain: "enquete-83090.firebaseapp.com",
  databaseURL: "https://enquete-83090-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "enquete-83090",
  appId: "1:160141092184:web:257ac4ce56d487afc0b12d"
};
/* E-mail du owner : il crée son compte avec cette adresse (ou se connecte avec Google).
   Le rôle owner n'est actif qu'une fois l'e-mail vérifié. Mettre la même adresse dans les règles Firebase. */
const OWNER_EMAIL = "yanis.mag4801@gmail.com";
const emailOwner = u => (u.email || "").toLowerCase() === OWNER_EMAIL;
const estOwner = u => !!u && emailOwner(u) && u.emailVerified;

const NOMS = ["Clara","Juliette","Esma","Henry","Isaac","Joshua","Mylan","Leo","Martin.H","Martin.F","Oscar","Chems",
  "Simon","Thomas","Olivia","Julia","Charlie","Elyne","Lucie","Bruno","Leandro","Julie","Wissal"];
const SEUIL = 80;
const $ = id => document.getElementById(id);
const champs = {}, minuteurs = {};
const appEls = [document.querySelector("header"), document.querySelector("main")];

/* ---------- Effets sonores ---------- */
let ctx, muet = localStorage.getItem("sfx-muet") === "1";
function son(freq, dur = .08, type = "sine", vol = .05, glisse = 1, delai = 0) {
  if (muet) return;
  try {
    ctx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    const t = ctx.currentTime + delai, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (glisse !== 1) o.frequency.exponentialRampToValueAtTime(freq * glisse, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + dur);
  } catch {}
}
const sfx = {
  focus:  () => son(660, .05, "triangle", .03),
  frappe: () => son(280 + Math.random() * 220, .035, "square", .012),
  taux:   v => son(260 + v * 6, .09, "sine", .05, 1.15),
  alerte: () => { son(330, .28, "sawtooth", .035, .45); son(250, .3, "sawtooth", .03, .5, .12); },
  ok:     () => { son(880, .12, "sine", .04); son(1320, .2, "sine", .035, 1, .09); },
  refus:  () => son(180, .2, "square", .03, .7),
  recu:   () => son(520, .12, "sine", .03, 1.5),
  on:     () => son(740, .08, "triangle", .04)
};
const bMute = $("mute");
function majBouton() { bMute.textContent = muet ? "🔇" : "🔊"; bMute.setAttribute("aria-label", muet ? "Activer le son" : "Couper le son"); }
bMute.onclick = () => { muet = !muet; localStorage.setItem("sfx-muet", muet ? "1" : "0"); majBouton(); sfx.on(); };
majBouton();

/* ---------- Tableau ---------- */
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1800); }

function construire(el, debut, fin) {
  for (let i = debut; i < fin; i++) {
    const r = document.createElement("div");
    r.className = "row";
    r.innerHTML = `<span class="n">${i + 1}</span>
      <input class="nom" data-i="${i}" data-c="nom" maxlength="30" readonly aria-label="Nom de l'élève ${i + 1}">
      <label class="jauge"><input data-i="${i}" data-c="taux" type="number" min="0" max="100" step="1" placeholder="—" inputmode="numeric" readonly aria-label="Taux de suspicion de l'élève ${i + 1}"><b>%</b></label>`;
    el.appendChild(r);
  }
}
construire($("g"), 0, 12);
construire($("d"), 12, NOMS.length);

function colorer(inp) {
  const r = inp.closest(".row"), j = inp.closest(".jauge");
  const v = inp.value === "" ? 0 : Math.max(0, Math.min(100, Number(inp.value)));
  j.style.setProperty("--v", v);
  j.style.setProperty("--h", 140 - 1.4 * v);
  r.classList.toggle("chaud", inp.value !== "" && v >= SEUIL);
}
function valeur(inp) {
  if (inp.dataset.c === "nom") return inp.value.trim();
  if (inp.value === "") return null;
  return Math.max(0, Math.min(100, Math.round(Number(inp.value))));
}
function majStat() {
  let max = -1, qui = "";
  for (let i = 0; i < NOMS.length; i++) {
    const t = champs[i].taux.value;
    if (t !== "" && Number(t) > max) { max = Number(t); qui = champs[i].nom.value; }
  }
  const s = $("stat");
  s.textContent = "Plus suspect : ";
  if (max < 0) { s.append("–"); return; }
  const b = document.createElement("b"); b.textContent = qui || "?";
  s.append(b, " " + max + " %");
}

document.querySelectorAll("input[data-i]").forEach(inp => {
  (champs[inp.dataset.i] ||= {})[inp.dataset.c] = inp;
  inp.addEventListener("focus", () => {
    if (inp.readOnly) { sfx.refus(); toast("Modification réservée aux admins"); }
    else sfx.focus();
  });
  inp.addEventListener("input", () => {
    if (inp.readOnly) return;
    if (inp.dataset.c === "taux") {
      if (inp.value !== "" && Number(inp.value) > 100) inp.value = 100;
      const v = Number(inp.value || 0), avant = Number(inp.dataset.prev || 0);
      colorer(inp);
      v >= SEUIL && avant < SEUIL ? sfx.alerte() : sfx.taux(v);
      inp.dataset.prev = v;
    } else sfx.frappe();
    majStat();
    clearTimeout(minuteurs[inp.dataset.i + inp.dataset.c]);
    minuteurs[inp.dataset.i + inp.dataset.c] = setTimeout(() => sauver(inp), 300);
  });
});

let premier = true, dernierSon = 0, dernier = null;
function afficher(data) {
  let change = false;
  NOMS.forEach((nomDefaut, i) => {
    const e = (data && data[i]) || {}, { nom, taux } = champs[i];
    const vn = e.nom ?? nomDefaut, vt = String(e.taux ?? "");
    let modif = false;
    if (document.activeElement !== nom && nom.value !== vn) { nom.value = vn; modif = true; }
    if (document.activeElement !== taux && taux.value !== vt) { taux.value = vt; taux.dataset.prev = vt || 0; colorer(taux); modif = true; }
    if (modif && !premier) {
      const r = nom.closest(".row"); r.classList.remove("flash"); void r.offsetWidth; r.classList.add("flash");
      change = true;
    }
  });
  if (change && Date.now() - dernierSon > 250) { sfx.recu(); dernierSon = Date.now(); }
  premier = false;
  majStat();
}

/* ---------- Firebase : données ---------- */
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database(), auth = firebase.auth();
let user = null, admin = false, owner = false;
function majEtat(ok, texte) { $("etat").classList.toggle("ok", ok); $("etat").lastElementChild.textContent = texte; }
const peutEditer = () => owner || admin;

function sauver(inp) {
  if (!peutEditer()) return;
  db.ref("eleves/" + inp.dataset.i + "/" + inp.dataset.c).set(valeur(inp))
    .then(() => { sfx.ok(); toast("Enregistré ✓"); })
    .catch(() => { sfx.refus(); toast("Modification refusée"); inp.blur(); afficher(dernier); });
}
function presence() {
  if (!user) return;
  const p = db.ref("users/" + user.uid + "/enLigne");
  p.onDisconnect().set(false).then(() => p.set(true)).catch(() => {});
}
db.ref(".info/connected").on("value", s => {
  majEtat(!!s.val(), s.val() ? "Synchronisé en direct" : "Reconnexion…");
  if (s.val()) presence();
});

/* ---------- Comptes et rôles ---------- */
const ERR = {
  "auth/email-already-in-use": "Cet e-mail a déjà un compte.",
  "auth/invalid-email": "Adresse e-mail invalide.",
  "auth/weak-password": "Mot de passe trop court (6 caractères minimum).",
  "auth/invalid-credential": "E-mail ou mot de passe incorrect.",
  "auth/user-not-found": "Aucun compte avec cet e-mail.",
  "auth/wrong-password": "E-mail ou mot de passe incorrect.",
  "auth/too-many-requests": "Trop de tentatives, réessayez dans quelques minutes.",
  "auth/operation-not-allowed": "Ce mode de connexion n'est pas activé dans Firebase.",
  "auth/unauthorized-domain": "Ce domaine n'est pas autorisé dans Firebase (Authentication > Paramètres).",
  "auth/popup-blocked": "La fenêtre Google a été bloquée par le navigateur.",
  "auth/account-exists-with-different-credential": "Cet e-mail a déjà un compte avec un mot de passe : connectez-vous avec.",
  "PERMISSION_DENIED": "Inscription refusée par les règles de la base."
};
function majDroits() {
  const peut = peutEditer();
  document.querySelectorAll("input[data-i]").forEach(i => i.readOnly = !peut);
  document.body.classList.toggle("lecture", !peut);
  const r = $("role");
  r.textContent = owner ? "Owner" : admin ? "Admin" : "Lecteur";
  r.classList.toggle("fort", peut);
  const nom = user ? (user.displayName || "Compte") : "Compte";
  $("compte").textContent = nom;
  $("cNom").textContent = nom;
  const attente = !owner && !!user && emailOwner(user);
  $("cRole").textContent = owner ? "Rôle : owner. Vous pouvez tout modifier et nommer des admins."
    : attente ? "Owner en attente : vérifiez votre e-mail avec le lien reçu, puis déconnectez-vous et reconnectez-vous."
    : admin ? "Rôle : admin. Vous pouvez modifier les noms et les taux."
    : "Rôle : lecteur. Vous pouvez consulter le tableau.";
  $("uid").value = user ? user.uid : "";
  $("bPanel").hidden = !owner;
}

let offAdmin = null, usersData = {}, adminsData = {};
auth.onAuthStateChanged(u => {
  user = u; owner = estOwner(u); admin = false;
  if (offAdmin) { offAdmin(); offAdmin = null; }
  db.ref("users").off(); db.ref("admins").off(); db.ref("eleves").off();
  /* Connecté : tableau. Pas de session sur cet appareil : page de connexion. */
  $("porte").hidden = !!u;
  appEls.forEach(e => e.hidden = !u);
  if (u) {
    db.ref("eleves").on("value", snap => { dernier = snap.val(); afficher(dernier); },
      err => majEtat(false, "Lecture impossible : " + err.message));
    const maj = { email: u.email, derniere: firebase.database.ServerValue.TIMESTAMP };
    if (u.displayName) maj.pseudo = u.displayName.slice(0, 20);
    db.ref("users/" + u.uid).update(maj).catch(() => {});
    presence();
    const r = db.ref("admins/" + u.uid);
    const f = r.on("value", s => { admin = s.val() === true; majDroits(); }, () => {});
    offAdmin = () => r.off("value", f);
  } else { premier = true; dernier = null; }
  if (owner) {
    db.ref("users").on("value", s => { usersData = s.val() || {}; rendreAdmins(); }, () => {});
    db.ref("admins").on("value", s => { adminsData = s.val() || {}; rendreAdmins(); }, () => {});
  }
  majDroits();
});

function rendreAdmins() {
  const l = $("listeAdmins"); l.replaceChildren();
  const ids = Object.keys(usersData).sort((a, b) => (usersData[a].pseudo || "").localeCompare(usersData[b].pseudo || ""));
  $("nbComptes").textContent = ids.length + " compte(s)";
  if (!ids.length) { l.textContent = "Aucun compte pour l'instant."; return; }
  ids.forEach(uid => {
    const est = adminsData[uid] === true, ligne = document.createElement("div");
    ligne.className = "lig";
    const nom = document.createElement("span"); nom.textContent = usersData[uid].pseudo || "Sans nom";
    const b = document.createElement("button"); b.className = "btn";
    if ((usersData[uid].email || "").toLowerCase() === OWNER_EMAIL) { b.textContent = "Owner"; b.disabled = true; }
    else {
      b.textContent = est ? "Retirer admin" : "Nommer admin";
      b.onclick = () => db.ref("admins/" + uid).set(est ? null : true)
        .then(() => { sfx.ok(); toast(est ? "Admin retiré" : "Nouvel admin ✓"); })
        .catch(() => { sfx.refus(); toast("Action refusée"); });
    }
    ligne.append(nom, b); l.append(ligne);
  });
}

/* ---------- Connexion / inscription ---------- */
let mode = "connexion";
function setMode(m) {
  mode = m;
  $("tabCo").setAttribute("aria-selected", m === "connexion");
  $("tabIn").setAttribute("aria-selected", m === "inscription");
  $("lPseudo").hidden = m !== "inscription";
  $("pseudo").required = m === "inscription";
  $("mdp").autocomplete = m === "inscription" ? "new-password" : "current-password";
  $("goAuth").textContent = m === "inscription" ? "Créer mon compte" : "Se connecter";
  $("erreur").textContent = "";
}
setMode("connexion");
$("tabCo").onclick = () => setMode("connexion");
$("tabIn").onclick = () => setMode("inscription");
$("compte").onclick = () => { sfx.on(); $("dlgCompte").showModal(); };
$("bPanel").onclick = () => { sfx.on(); $("dlgAdmins").showModal(); };
$("bDeco").onclick = () => { $("dlgCompte").close(); auth.signOut(); toast("Déconnecté"); };
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest("dialog").close());
document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", e => { if (e.target === d) d.close(); }));

$("fAuth").onsubmit = async e => {
  e.preventDefault();
  const email = $("email").value.trim(), mdp = $("mdp").value, pseudo = $("pseudo").value.trim();
  $("erreur").textContent = "";
  try {
    /* « Cookie » : session gardée sur l'appareil (LOCAL) ou seulement jusqu'à la fermeture de l'onglet (SESSION) */
    await auth.setPersistence($("rester").checked ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
    if (mode === "inscription") {
      const c = await auth.createUserWithEmailAndPassword(email, mdp);
      await c.user.updateProfile({ displayName: pseudo });
      await db.ref("users/" + c.user.uid).set({ pseudo });
    } else {
      const c = await auth.signInWithEmailAndPassword(email, mdp);
      const p = db.ref("users/" + c.user.uid + "/pseudo");
      if (!(await p.once("value")).exists()) p.set((c.user.displayName || email.split("@")[0]).slice(0, 20)).catch(() => {});
    }
    majDroits();
    $("fAuth").reset(); sfx.ok();
    toast(mode === "inscription" ? "Compte créé ✓" : "Connecté ✓");
  } catch (err) {
    sfx.refus();
    $("erreur").textContent = ERR[err.code] || ERR[err.message] || err.message;
  }
};

/* Connexion / création de compte avec Google (le compte est créé à la première utilisation) */
$("goGoogle").onclick = async () => {
  $("erreur").textContent = "";
  const prov = new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({ prompt: "select_account" });
  try {
    await auth.setPersistence($("rester").checked ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
    let c;
    try { c = await auth.signInWithPopup(prov); }
    catch (err) {
      if (err.code === "auth/popup-blocked") { await auth.signInWithRedirect(prov); return; }
      throw err;
    }
    const p = db.ref("users/" + c.user.uid + "/pseudo");
    if (!(await p.once("value")).exists())
      await p.set((c.user.displayName || c.user.email.split("@")[0]).slice(0, 20)).catch(() => {});
    majDroits(); sfx.ok();
    toast(c.additionalUserInfo && c.additionalUserInfo.isNewUser ? "Compte créé ✓" : "Connecté ✓");
  } catch (err) {
    if (err.code === "auth/popup-closed-by-user" || err.code === "auth/cancelled-popup-request") return;
    sfx.refus();
    $("erreur").textContent = ERR[err.code] || err.message;
  }
};

$("oubli").onclick = () => {
  const email = $("email").value.trim();
  if (!email) { $("erreur").textContent = "Saisissez d'abord votre e-mail."; return; }
  auth.sendPasswordResetEmail(email)
    .then(() => { $("erreur").textContent = ""; toast("E-mail de réinitialisation envoyé"); })
    .catch(err => $("erreur").textContent = ERR[err.code] || err.message);
};
</script>
